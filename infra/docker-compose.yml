services:
  db:
    image: postgis/postgis:16-3.4
    container_name: places_db
    environment:
      POSTGRES_USER: places
      POSTGRES_PASSWORD: places
      POSTGRES_DB: places
    ports:
      - "5432:5432"
    volumes:
      - places_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U places -d places"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  places_db_data:
