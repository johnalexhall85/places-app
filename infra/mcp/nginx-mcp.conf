# CHIP MCP endpoint. Included inside a 443 server block:
#   include /home/john/chip-beta/infra/mcp/nginx-mcp.conf;   (staging: chip-beta host -> 8011)
# The production server block for mcp.publicdataobservatory.org proxies to 8012 instead (see README.md).
# The limit_req_zone line belongs in the http{} context: /etc/nginx/conf.d/chip-mcp-ratelimit.conf
#   limit_req_zone $binary_remote_addr zone=chip_mcp:10m rate=30r/m;
location = /mcp {
    limit_req zone=chip_mcp burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;

    proxy_pass http://127.0.0.1:8011/mcp;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Public, no login: never forward the website's access-code cookie, never set one.
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "no-store" always;
}
