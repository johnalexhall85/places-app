# Production MCP host: https://mcp.publicdataobservatory.org/mcp -> chip-mcp (127.0.0.1:8012, live data, read-only).
# Installed as /etc/nginx/sites-available/chip-mcp (enabled as chip-mcp). Exposes only /mcp; everything else is 404.
# Rate limit: 120 requests/min per IP, burst 60 (ChatGPT and Claude call from shared cloud IPs).
limit_req_zone $binary_remote_addr zone=chip_mcp_live:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mcp.publicdataobservatory.org;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.publicdataobservatory.org;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/mcp.publicdataobservatory.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.publicdataobservatory.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /mcp {
        limit_req zone=chip_mcp_live burst=60 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;

        proxy_pass http://127.0.0.1:8012/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-store" always;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8012/healthz;
    }
    location / {
        return 404;
    }
}
