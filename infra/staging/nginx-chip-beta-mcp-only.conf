# chip-beta after the Tailscale cutover: only the public beta MCP server stays on the internet.
# The staging website is served privately by `tailscale serve` (proxying to Nginx port 8080);
# see infra/staging/README.md "Private access through Tailscale".
# Install: sudo cp infra/staging/nginx-chip-beta-mcp-only.conf /etc/nginx/sites-available/chip-beta
#          sudo nginx -t && sudo systemctl reload nginx
# Roll back by installing infra/staging/nginx-chip-beta.conf the same way.
server {
    listen 80;
    listen [::]:80;
    server_name chip-beta.publicdataobservatory.org;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chip-beta.publicdataobservatory.org;
    ssl_certificate /etc/letsencrypt/live/chip-beta.publicdataobservatory.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chip-beta.publicdataobservatory.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Public MCP server (no login, read-only) and its /funding/nofo/ dataset links: docs/mcp/PLAN.md
    include /home/john/chip-beta/infra/mcp/nginx-mcp.conf;

    # Everything else (the staging website and its API) is private: Tailscale only.
    location / {
        return 404;
    }
}
