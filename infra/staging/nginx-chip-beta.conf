server {
    listen 80;
    listen [::]:80;
    server_name chip-beta.publicdataobservatory.org;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# CHIP staging site: port 8080 -> staging backend 127.0.0.1:8001 and /var/www/places-staging.
# Generated from infra/nginx/places-demo.conf; keep the two in step. Port 8080 stays closed in UFW.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chip-beta.publicdataobservatory.org;
    ssl_certificate /etc/letsencrypt/live/chip-beta.publicdataobservatory.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chip-beta.publicdataobservatory.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Public MCP server (no login, read-only): docs/mcp/PLAN.md
    include /home/john/chip-beta/infra/mcp/nginx-mcp.conf;

    # Lightweight hardening that is safe for demo use.
    server_tokens off;
    client_max_body_size 20m;

    # Serve from a web-readable path (copy build artifacts to /var/www/places).
    root /var/www/places-staging;
    index index.html;

    # Normalize /api (no trailing slash) to the proxied prefix.
    location = /api {
        return 301 /api/;
    }

    # CDC Funding API v1 routes are registered in FastAPI with their own /api prefix.
    # Preserve the full URI here so public /api/cdc-funding/v1/* reaches
    # backend /api/cdc-funding/v1/* instead of being rewritten to /cdc-funding/v1/*.
    location /api/cdc-funding/v1/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # CDC funding map routes are registered in FastAPI with their own /api prefix.
    # Preserve the full URI here so public /api/cdc/funding/* reaches
    # backend /api/cdc/funding/* instead of being rewritten to /cdc/funding/*.
    location /api/cdc/funding/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Demo access routes are registered in FastAPI with their own /api prefix.
    # Preserve the full URI so cookies and admin calls reach /api/demo-access/*.
    location /api/demo-access/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # All frontend API requests use /api/* and are proxied to FastAPI on localhost.
    # The trailing slash on proxy_pass strips the /api prefix for older backend
    # routes that are mounted without /api in FastAPI.
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Deny accidental access to hidden files.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # SPA fallback for Vite/React routes (e.g. /profile/county/:id).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
