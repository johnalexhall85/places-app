server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Lightweight hardening that is safe for demo use.
    server_tokens off;
    client_max_body_size 20m;

    # Serve from a web-readable path (copy build artifacts to /var/www/places).
    root /var/www/places;
    index index.html;

    # Normalize /api (no trailing slash) to the proxied prefix.
    location = /api {
        return 301 /api/;
    }

    # CDC funding routes are registered in FastAPI with their own /api prefix.
    # Preserve the full URI here so public /api/cdc/funding/* reaches
    # backend /api/cdc/funding/* instead of being rewritten to /cdc/funding/*.
    location /api/cdc/funding/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Demo access routes are registered in FastAPI with their own /api prefix.
    # Preserve the full URI so cookies and admin calls reach /api/demo-access/*.
    location /api/demo-access/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # All frontend API requests use /api/* and are proxied to FastAPI on localhost.
    # The trailing slash on proxy_pass strips the /api prefix for older backend
    # routes that are mounted without /api in FastAPI.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Deny accidental access to hidden files.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # SPA fallback for Vite/React routes (e.g. /profile/county/:id).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
