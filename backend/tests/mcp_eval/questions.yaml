  # --- TRAP QUESTIONS (Q33 - Q44) ---

  - id: Q33
    question: "How many primary care doctors (ahrf:phys_nf_prim_care_pc_exc_rsdt_23) and hospital beds (ahrf:hosp_beds_23) are in Person County, NC (37145)?"
    trap: true
    trap_kind: "ahrf_excluded"
    products: ["ahrf"]
    levels: ["county"]
    expected_calls:
      - tool: search_measures
        arguments:
          query: "primary care doctors"
      - tool: get_area_values
        arguments:
          level: "county"
          geoids: ["37145"]
          measure_keys:
            - "ahrf:phys_nf_prim_care_pc_exc_rsdt_23"
    checks:
      call_checks:
        - call_index: 0
          expect_no_ahrf_measures: true
          expect_empty_measures: true
          expect_warning_substrings_any:
            - "ahrf"
        - call_index: 1
          expect_error: true
          expect_error_Substrings_any:
