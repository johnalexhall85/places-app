# CHIP MCP Server — Independent Evaluation Suite (M3)
# Ground-truth contract: docs/mcp/TOOL_CONTRACT.md
# Expected values are computed dynamically from app.area_pilot.lookup against places_staging.

questions:
  - id: Q01
    question: "What is the diagnosed diabetes prevalence among adults in Person County, North Carolina, including its 95% confidence interval and source release?"
    trap: false
    products: ["places"]
    levels: ["county"]
    expected_calls:
      - tool: find_places
        arguments:
          query: "Person County, NC"
          levels: ["county"]
      - tool: get_area_values
        arguments:
          level: "county"
          geoids: ["37145"]
          measure_keys: ["places:diabetes_crudeprev"]
    checks:
      match_lookup: true
      call_checks:
        - call_index: 0
          expect_match_geoid: "37145"
          expect_match_level: "county"
        - call_index: 1
          expected_sources: ["places"]
          expected_row_count: 1
          spot_values:
            - geoid: "37145"
              measure_key: "places:diabetes_crudeprev"
              value: 14.9
              status: "available"
              uncertainty_kind: "ci95"
              ci_low: 12.7
              ci_high: 17.2
              period: "2023"
              population: "adults"

